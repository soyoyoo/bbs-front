# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;
        root         /usr/share/nginx/html;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

    	# SpringBoot 무정지 배포 변수 ($service_url = http://127.0.0.1:8081 또는 8082)
	include /etc/nginx/conf.d/service-url.inc;

	# -------------------------------------------------------------
	# 1. React 게시판 - 배포 산출물을 /usr/share/nginx/html/bbs-front/에 복사
	# -------------------------------------------------------------
	location = /bbs-front {
		return 301 /bbs-front/;
	}

	location = /bbs-front/index.html {
		alias /usr/share/nginx/html/bbs-front/index.html;
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
	}

	location /bbs-front/ {
		alias /usr/share/nginx/html/bbs-front/;
		try_files $uri $uri/ /bbs-front/index.html;
	}

	# Legacy builds used root-absolute asset URLs. Keep them working during deployment.
	location ^~ /assets/ {
		root /usr/share/nginx/html/bbs-front;
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location = /favicon.svg {
		root /usr/share/nginx/html/bbs-front;
		try_files $uri =404;
	}

	# React 챗봇 UI
    	location /chatbot-front/ {
        	alias /usr/share/nginx/html/chatbot-front/;
        	index index.html;
        	try_files $uri $uri/ /chatbot-front/index.html;
    	}

	# 💡 2-1. SpringBoot 백엔드 전용 API (/api/v1/ 은 SpringBoot로 전달)
    	# /api/ 보다 경로가 길기 때문에 /api/v1/ 요청은 이 블록이 우선 처리합니다.
    	location /api/v1/ {
        	proxy_pass $service_url;

        	proxy_set_header Host $host;
        	proxy_set_header X-Real-IP $remote_addr;
        	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto $scheme;

        	proxy_connect_timeout 300s;
        	proxy_read_timeout 300s;
        	proxy_send_timeout 300s;
    	}
	
  
	# ------------------------------------------------------------------
    	# 2.2 NestJS 백엔드 API (챗봇 서버) - /api/v1/ 을 제외한 /api/ 요청
    	# ------------------------------------------------------------------
    	location /api/ {
        	proxy_pass http://localhost:3000/;
        	proxy_http_version 1.1;

        	# 기본 프록시 헤더
        	proxy_set_header Host $host;
        	proxy_set_header X-Real-IP $remote_addr;
        	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto $scheme;

        	# SSE / WebSocket 연결 헤더
        	proxy_set_header Upgrade $http_upgrade;
        	proxy_set_header Connection 'upgrade';

        	# OpenAI 스트리밍 버퍼링 방지 (필수)
        	proxy_buffering off;
        	proxy_cache off;
        	proxy_read_timeout 3600s;
    	}

	# OAuth 로그인 시작, callback 및 로그아웃은 Spring Boot로 전달
	location ^~ /oauth2/ {
		proxy_pass $service_url;
		proxy_redirect ~^/$ /bbs-front/;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ^~ /login/oauth2/ {
		proxy_pass $service_url;
		proxy_redirect ~^/$ /bbs-front/;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /logout {
		proxy_pass $service_url;
		proxy_redirect ~^/$ /bbs-front/;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	
	# 3. SpringBoot 게시판 (나머지 모든 루트 요청)
    	location / {
        	proxy_pass $service_url;
		
		# Host 헤더를 $http_host로 전달해야 SpringBoot가 리다이렉트 주소를 정확히 유지합니다.
        	proxy_set_header Host $http_host;
        	proxy_set_header X-Real-IP $remote_addr;
        	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto $scheme;

        	proxy_connect_timeout 300s;
        	proxy_read_timeout 300s;
        	proxy_send_timeout 300s;
    	}

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }

